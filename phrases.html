<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Phrase Generator</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="/phrases.css?v=10272026.14">
</head>
<body>
  <header class="app-header">
    <h1>Phrase Generator</h1>
    <p class="subtitle">Assemble groups of words, put them in order, and generate a phrase with one random word from each group.</p>
  </header>

  <main>
    <section class="result" aria-live="polite">
      <p id="phrase" class="phrase placeholder">Awaiting transmission&hellip;</p>
      <button id="copy-btn" class="btn btn-ghost" type="button" hidden>Copy</button>
    </section>

    <ol id="groups" class="groups"></ol>

    <button id="add-group-btn" class="btn btn-secondary add-group" type="button">+ Add group</button>
  </main>

  <footer class="action-bar">
    <div class="action-bar-inner">
      <button id="undo-btn" class="btn btn-secondary history-btn" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>&#8630;<span class="btn-label"> Undo</span></button>
      <button id="generate-btn" class="btn btn-primary" type="button">Generate random phrase</button>
      <button id="redo-btn" class="btn btn-secondary history-btn" type="button" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled>&#8631;<span class="btn-label"> Redo</span></button>
    </div>
  </footer>

  <template id="group-template">
    <li class="group">
      <div class="group-header">
        <span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#10303;</span>
        <span class="group-number"></span>
        <input class="group-name" type="text" placeholder="Group Name" aria-label="Group name">
        <div class="group-controls">
          <button class="icon-btn move-up" type="button" aria-label="Move group up" title="Move up">&#8593;</button>
          <button class="icon-btn move-down" type="button" aria-label="Move group down" title="Move down">&#8595;</button>
          <button class="icon-btn delete-group" type="button" aria-label="Delete group" title="Delete group">&#10005;</button>
        </div>
      </div>
      <ul class="words"></ul>
      <form class="add-word">
        <input class="word-input" type="text" placeholder="Add a word" aria-label="Add words" autocapitalize="none" enterkeyhint="done">
        <button class="btn btn-secondary" type="submit">Add</button>
      </form>
    </li>
  </template>

  <script src="/phrases.js?v=10272026.14"></script>
</body>
</html>
